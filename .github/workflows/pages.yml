name: Deploy Rupkas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://slmwoczmrplhypurkgvx.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsbXdvY3ptcnBsaHlwdXJrZ3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTIwMzEsImV4cCI6MjEwNjg4MDMxOX0.lWaKkOnI0vMbmc97d9oT9mpwd-lNedPoC8D1DCEiN-Q
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Validate frontend environment
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Validate Supabase API key
        run: |
          curl --fail --silent --show-error             -H "apikey: $VITE_SUPABASE_ANON_KEY"             "$VITE_SUPABASE_URL/auth/v1/settings" >/dev/null

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
